name: zig-stateless-scanner

services:
  zingela-web:
    image: nginx:alpine
    container_name: zingela-scanner-console
    ports:
      - "${ZINGELA_PORT:-8012}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  zingela-ai-bridge:
    image: python:3.11-alpine
    container_name: zingela-ai-bridge
    command: >
      python3 -c "print('Hindsight AI Connected for Zingela Stateless Scanner')"
    restart: "no"
